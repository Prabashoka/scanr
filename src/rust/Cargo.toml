[package]
name = "scanr"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
[lib]
name = "scanr"
crate-type = ["staticlib"]

[dependencies]
extendr-api = "0.9"
scan-core = { git = "https://github.com/Prabashoka/scan-core.git", tag = "v0.2.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"                   # cross-crate inlining across extendr + rayon boundary
codegen-units = 1             # single CGU enables full whole-program optimization
